[package]
name = "iota"
description = "An agent CLI for the terminal"
homepage = "https://iota.sh"
readme = "README.md"
keywords = ["cli", "agent", "llm", "mcp", "terminal"]
categories = ["command-line-utilities"]
publish = false
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/iotash/iota"
default-run = "iota"

# ONE package: the library holds every module, `src/main.rs` is the thin binary. No workspace,
# no per-area manifests (docs/ARCHITECTURE.md §1).

# `publish = false` keeps the crate off crates.io, which also hides it from dist's package scan.
# This says "no crates.io, but yes, release the binary" (dist-workspace.toml does the rest).
[package.metadata.dist]
dist = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "iota"
path = "src/main.rs"

[features]
# The ONLY cargo feature: the shared test fakes (`src/testing/`), enabled by the
# self-dev-dependency below so integration tests see them. It never changes what
# the shipped binary contains.
default = []
testing = []

[dependencies]
# async runtime
tokio       = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "fs", "net"] }
tokio-util  = { version = "0.7", default-features = false }
futures     = { version = "0.3", default-features = false, features = ["std", "async-await"] }
bytes       = "1"
# data
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", features = ["raw_value"] }
serde_norway = "0.9"
thiserror    = "2"
anyhow       = "1"
# `tracing` is the DEVELOPER's channel: rmcp, hyper, process-wrap and the two `debug!`s in
# `src/shell/exec.rs` speak it, and nobody hears it unless `IOTA_LOG=<path>` installs the file
# subscriber (`src/diag.rs`). Anything a USER must see never travels on it — it goes through
# `cmd::io::Streams::warning` or the transcript (DIVERGENCES X-29). Until 2026-09-15 this line
# said `release_max_level_off`, which compiled every event out of the shipped binary: the one
# `tracing::warn!` that WAS meant for the user (a duplicate MCP wire name) therefore never
# reached anyone. With the switch opt-in there is no reason to strip the release build — an
# unsubscribed event costs one relaxed atomic load at the call site — so the ceiling is now
# `debug`: `trace` is the one level nothing here ever asks for, and dropping it keeps the
# dependencies' per-frame chatter (h2, hyper) out of the binary.
tracing      = { version = "0.1", default-features = false, features = ["std", "release_max_level_debug"] }
# http / mcp
# ONE TLS backend, no choice: rustls with its default aws-lc-rs provider (`reqwest/rustls`; the
# platform verifier comes with it). rmcp pairs it with its `reqwest` feature. Both MCP transports,
# always.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "system-proxy", "rustls"] }
# `auth` is rmcp's OAuth 2.1 client (discovery, dynamic registration, PKCE, the refreshing `AuthClient`
# the streamable-HTTP transport is wrapped in) — `src/mcp/auth.rs` is the only module that names it, and
# it brings `oauth2` 5 (no default features) + `url` into the binary, nothing else new to Cargo.lock.
rmcp    = { version = "3.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
# cli
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# misc
base64   = "0.23"
sha2     = { version = "0.11", default-features = false }
httpdate = "1"
rand     = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng"] }
regex    = "1"
# `edit_file` searches and replaces on `&[u8]`, never on a decoded `String`: a source file in Latin-1,
# Shift-JIS or GBK must come back off disk byte for byte. `memmem::Finder` is the substring search that
# works on bytes (and the one `regex`, `globset` and `ignore` already build on — no new crate).
memchr   = "2"
globset  = "0.4"
ignore   = "0.4"
walkdir  = "2"
jiff     = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# TUI stack — pinned exact; verified against ~/.cargo/registry (TUI_CONTRACTS §12). Only
# `src/ui/**` may name ratatui/crossterm (ci.sh grep gate).
# "scrolling-regions" is always on (one-binary decision, 2026-09-01): streaming inserts ride
# DECSTBM in-region scrolls, and there is no portable fallback build any more (wart W9 is a
# per-terminal verification item in docs/TUI-VERIFY.md, not a compile-time choice).
ratatui   = { version = "=0.30.2", features = ["unstable-rendered-line-info", "scrolling-regions"] }
# ratatui default features stay ON: "crossterm" (ratatui-crossterm, default pairing
# crossterm_0_29), all-widgets, layout-cache, macros, underline-color. NEVER enable
# crossterm_0_28 (wart W8).
crossterm = { version = "=0.29.0" }
unicode-width        = "=0.2.2"
unicode-segmentation = "1.13"
# token accounting (WP53) — embeds the o200k_base BPE ranks (zstd-compressed, decompressed
# in-process at first use), so the counter is offline exactly as Go's tiktoken-go +
# tiktoken-go-loader pair is: the table ships IN the binary, never downloaded at runtime.
# default-features = false is load-bearing: the default `vocabs-all` would embed 12 vocab
# sets (+2.92 MiB) where the counter only ever asks for o200k_base.
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-o200k_base"] }
# Syntax highlighting (WP55) — pure-Rust regex engine (fancy-regex):
# no C toolchain, no `onig` build. two-face carries bat's syntax + theme dumps, which is
# where the chroma-equivalent language coverage and the monokai/github themes come from.
syntect  = { version = "=5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy", "html"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
# /export HTML (T3, WP65): CommonMark + GFM in safe mode with the `SyntaxHighlighterAdapter` seam for
# the code-fence renderer. default-features = false drops the CLI, `bon` and comrak's own
# `syntect-onig` feature — that one would bundle syntect's default syntax/theme dumps and onig beside
# two-face's; our adapter reuses `markdown::highlight`'s syntax set (docs/ARCHITECTURE.md §11).
comrak = { version = "=0.54.0", default-features = false }
# imgterm (T3, WP63): the half-block rasteriser's decoders — exactly the four formats Go registers
# (png/jpeg/gif/webp; all pure Rust in 0.25, no rayon). Encoders are reachable only from tests
# (LTO strips them from the binary). Only `src/imgterm.rs` may name the crate (ci.sh grep).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# /debug (T3, WP66): `record_response` rebuilds the response through `http::Response` →
# `reqwest::Response` (`From<http::Response<T>>`, reqwest-0.13.4 response.rs:459). reqwest re-exports
# `header`/`Method`/`StatusCode`/`Version`/`Url` but not the crate (lib.rs:279-282), so naming
# `http::Response` needs the direct dependency; already in Cargo.lock (1.5.0) — no new transitive crate.
http = "1"
# The `IOTA_LOG=<path>` file subscriber (`src/diag.rs`): tracing's own consumer, built with only
# `fmt` + `std` — no `ansi` (a log file never wants SGR), no `env-filter` (the level is fixed, its
# `regex`/`matchers` pull stays out), no `tracing-log` bridge. Brings `sharded-slab` and
# `thread_local` (the registry's span storage); nothing else is new to Cargo.lock.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# Process supervision, the one thing `src/shell/exec.rs` cannot write itself: this crate forbids `unsafe`, so
# the syscalls that own a process TREE have to come from somewhere. Both entries are that somewhere, and
# nothing else in the tree reaches for either.
#
# Unix: `setpgid` at spawn, then `killpg(SIGKILL)` — `nix` is those two and the `ESRCH` they answer with.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "fs"] }

# Windows: a Job Object owns the child and every process it goes on to start, so `TerminateJobObject` is
# `killpg` (Codex and Gemini CLI converged on the same primitive). `process-wrap` is watchexec's successor to
# `command-group` and the only maintained crate that offers it behind a tokio `Command`; goose ships it.
# `windows` appears only to name `CREATE_NO_WINDOW` for process-wrap's own `CreationFlags` wrapper — a caret
# range, deliberately, so it resolves to the SAME copy of the crate process-wrap builds against (an `=` pin
# here would split the two the day process-wrap moves, and `PROCESS_CREATION_FLAGS` would stop type-checking).
# (rmcp already carries a process-wrap 9.x of its own for the stdio MCP transport, so a Windows build compiles
# two versions of this crate. Pinning ours to 9 to unify them would tie our supervision layer to whatever an
# unrelated dependency happens to bump to; the macOS and Linux binaries — the ones under the size budget —
# never build ours at all.)
[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "creation-flags", "tracing"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
# The crate itself with the test fakes on: integration tests build against the
# `testing` module (cargo unifies the feature into the lib for test builds only).
iota = { path = ".", features = ["testing"] }
# `test-util` = tokio's paused clock: `retry_round`'s linear backoff is a CONST (the Go
# `retryBackoff` var existed so tests could compress it), so the suite compresses time
# instead of the constant (DEVIATIONS3 [WP49]).
tokio = { version = "1.53", default-features = false, features = ["test-util"] }
# In-process MCP servers for the manager tests (rmcp `server` dev-feature).
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-async-rw"] }
wiremock          = "0.6"
tempfile          = "3"
pretty_assertions = "1"
vt100             = "=0.16.2"   # byte-stream assertions of the terminal layer

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 1

# The profile `dist` builds release binaries with. It inherits `release` and overrides NOTHING:
# what a tag ships is byte-for-byte what `./ci.sh` measured against the 12 MiB budget. (dist's own
# default weakens this to `lto = "thin"` for faster CI; a fat-LTO build twice a year is cheaper
# than shipping a binary nobody measured.)
[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
must_use_candidate = "allow"
