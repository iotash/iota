[workspace]
members = ["cargo:."]

# Config for 'dist' — the release pipeline (docs/history/MIGRATION-ROADMAP.md §2.6).
# `dist init` regenerates .github/workflows/release.yml from this file; edit here, never there.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `powershell` is the Windows twin of `shell`: one
# `irm … | iex` line that fetches the archive for the machine's architecture, checks its SHA-256
# and drops `iota.exe` in `%CARGO_HOME%\bin`.
# NO MSI: it wants the WiX toolchain and a generated `main.wxs` that `dist generate --check`
# then polices, it only covers x86_64, and — nothing here signs Windows artifacts — an unsigned
# `.msi` is treated far more harshly by SmartScreen than a script the user pasted themselves.
# The `.ps1` already is the one-line install, so the MSI would only buy an Add/Remove entry.
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# One runner per target. aws-lc-rs compiles C, so crossing to another OS would need a second C
# toolchain (a Linux host building Windows, say); crossing architectures inside macOS needs
# nothing extra — Apple clang emits x86_64 as readily as arm64, and the `cc` crate only adds
# `-arch`. So `x86_64-apple-darwin` is cross-built on an arm64 runner; the other four are native.
# Windows joined the list once `nix` moved behind `cfg(unix)`; `x86_64-pc-windows-msvc` builds on
# `windows-2022`, which needs the NASM step from `github-build-setup` below.
#
# NO `aarch64-pc-windows-msvc`, for now. The crypto side is fine — AWS lists that triple as
# build+test supported, and NASM is an x86 assembler it does not even ask for there. What is
# missing is a runner dist will use: `KNOWN_GITHUB_RUNNERS` in dist 0.33.0 knows no ARM Windows
# machine, so a non-x86_64 Windows target silently becomes a `messense/cargo-xwin` cross-compile
# inside a Linux container — a toolchain this crate has never been built with, and one the
# Windows-gated NASM step would not even fire for. Pointing it at the native
# `windows-11-arm` runner takes a hand-written `host = …` override, and nothing in `ci.yml`
# would catch a break: the first signal would be a red tag.
# The user-visible cost is a hard stop, not a silent downgrade: the `.ps1` installer resolves
# ARM64 Windows to `aarch64-pc-windows-*`, finds neither in the manifest, and exits with
# `could not find binaries for this platform` — it never falls back to the x86-64 build under
# emulation.
# Re-evaluate when all three hold: (1) a tag has produced a green `x86_64-pc-windows-msvc`
# build, so the easy Windows target is proven; (2) `ci.yml` has a `windows-11-arm` job that
# compiles and tests the crate there; (3) dist knows that runner natively, or we have accepted
# writing the `[dist.github-custom-runners.aarch64-pc-windows-msvc]` runner/host pair by hand.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The Homebrew formula is written to the organisation's own tap on every tag. `chatchain.rb` in
# the personal joyqi/homebrew-tap is a different project and stays where it is.
tap = "iotash/homebrew-tap"
formula = "iota"
# Push the formula (needs the HOMEBREW_TAP_TOKEN secret on iotash/iota).
publish-jobs = ["homebrew"]
# The macOS code-signature gate. This is the first dist stage whose jobs wait on every per-target
# build, so it is where a check on the built artifacts belongs: `local-artifacts-jobs` runs beside
# the builds, not after them, and would find nothing to inspect. A red job here stops `host`, so a
# binary that fails `codesign -v` is never published.
global-artifacts-jobs = ["./verify-macos-signing"]
# Steps spliced into the generated `build-local-artifacts` job, right after the checkout, so
# `release.yml` stays a generated file nobody hand-edits. The one step in there installs NASM,
# which `aws-lc-sys` needs to assemble its x86 code on Windows — `ci.yml` has carried the same
# step since the Windows job was added, and a release built without it does not link.
# The path is relative to `.github/workflows/`; the file sits one level up so GitHub does not
# mistake it for a workflow of its own.
github-build-setup = "../build-setup.yml"

# Runner overrides for targets dist already knows. dist 0.33.0's `KNOWN_GITHUB_RUNNERS` still sends
# `aarch64-apple-darwin` to `macos-14`, an image GitHub retires on 2026-11-02 (with brownouts —
# jobs on it simply fail — before that), so a tag pushed then would go red on this one build.
# `macos-15` is the same arm64 hardware one OS newer; the string form keeps the host triple dist
# infers, and the matrix is computed by `plan` at release time, so `release.yml` does not change.
#
# `x86_64-apple-darwin` leaves `macos-15-intel`, the last Intel image, which GitHub retires around
# 2027-08; keeping it would hang every release on that date. It now cross-compiles on the same
# arm64 `macos-15`: Apple clang targets both architectures, so aws-lc-sys builds through `cc`
# (no CMake, no NASM) and the result is a plain x86_64 binary with the same 10.12 floor and the
# same dylibs as the native build. Same string form as above — dist infers the runner's own host
# (`aarch64-apple-darwin`) and, seeing host and target differ, has rustup add the x86_64 std
# before it builds.
#
# `x86_64-pc-windows-msvc` keeps dist's own pick, `windows-2022`.
#
# `global` is the runner for every job that ships no user artifact — plan, build-global-artifacts,
# host, publish-homebrew-formula, announce. dist 0.33.0 defaults those to `ubuntu-22.04`, which
# GitHub retires on 2027-04-17 (brownouts from 2027-03); none of them cares about glibc, so they
# move straight to `ubuntu-24.04`. Unlike the string overrides above, this one is baked into
# `release.yml`'s `runs-on:` lines, so the file was regenerated with it.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
global = "ubuntu-24.04"

# The two Linux builds run on `ubuntu-24.04(-arm)` but inside a manylinux_2_28 container
# (AlmaLinux 8, glibc 2.28). The runner's glibc is what the binary links against, and dist also
# writes it into the manifest as the floor the shell installer enforces: built on bare 24.04 that
# would be 2.39 and lock out Ubuntu 22.04, Debian 12, the RHEL 9 family and AL2023. In the
# container the floor is 2.28, which also takes in RHEL 8, Debian 11 and Ubuntu 20.04.
# Before this, on bare 22.04, the binary needed GLIBC_2.34 but the installer demanded 2.35 (the
# build machine's), so RHEL 9 / AL2023 users could run iota but not install it.
# `host` is spelled out because a container entry needs it; it is the same triple as the target.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-gnu" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-gnu" }
