name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  ci:
    name: ci (${{ matrix.os }})
    # A hung job holds its own logs hostage: GitHub publishes a job's log only once the run ends,
    # and a manual force-cancel discards it — the macos-14 job of run 34766745951 sat in
    # `Run ci.sh` for 64 minutes and its log is a 404 to this day, so two rounds of CI cost a
    # human intervention and still said nothing about WHERE it hung. A timeout ends the job the
    # graceful way instead, and the log is uploaded. Healthy runs on a cold cache measure ~6 min
    # (ubuntu), ~12 min (windows) and ~9 min (macos, through the tmux suite) plus the one release
    # build, so 45 is roughly double the longest leg's honest worst case.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap
          # bubblewrap needs unprivileged user namespaces; Ubuntu 24.04 restricts them by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      # aws-lc-sys assembles its bignum and AES-NI routines with NASM when it builds for MSVC, and
      # the runner image does not ship one. Installing it here is what keeps the TLS backend the SAME
      # everywhere (rustls + aws-lc-rs, Cargo.toml) — the alternative, a ring provider on Windows
      # only, would mean two TLS stacks to reason about for one missing assembler.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ci.sh exports these two itself; they are repeated here so the workflow says it out loud:
      # on these two runners the tmux suite and the sandbox tests MUST run, and a runner that has
      # lost tmux or bubblewrap fails the job naming it, rather than printing SKIP and passing
      # (tests/ui_tmux/main.rs, tests/tool/shell.rs).
      - name: Run ci.sh
        if: runner.os != 'Windows'
        env:
          IOTA_TMUX_REQUIRED: "1"
          IOTA_SANDBOX_REQUIRED: "1"
        run: ./ci.sh

      # Windows runs no `ci.sh`: that script is the Unix gate, and half of it is things this platform
      # does not have (tmux, bubblewrap, the sandbox) or does not ship (the release size budget, which
      # is measured once, on the platforms that are released). The checks it runs that are NOT
      # platform-specific — the dependency allowlist, the stub scan, the layering greps — already ran
      # twice above; running them a third time would prove nothing new. What is left is the question
      # this job exists to answer: does the code compile, and do its tests pass, on Windows.
      #
      # The shell, sandbox and tmux suites skip themselves here by `#[cfg(unix)]` on the module or the
      # test, never by failing to find a binary — see tests/tool/main.rs. Neither IOTA_TMUX_REQUIRED
      # nor IOTA_SANDBOX_REQUIRED is set: this platform has no tmux and no OS sandbox, so there is
      # nothing for either to require.
      - name: fmt, clippy, docs and tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cargo test

      - name: Upload binary size
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.os }}
          path: target/size.md

  # The transitive-graph gate: licenses, advisories, duplicate versions and sources over every
  # crate in the five shipping targets, as deny.toml says. Its own job, not a step of the matrix:
  # the graph is the same on every runner and the advisory database is one download, so it
  # runs once, needs no target directory and is not waiting on a release build. `./ci.sh` runs
  # the same check locally when cargo-deny is installed and prints SKIP when it is not; this job
  # never skips. The direct-dependency allowlist stays with scripts/check-deps.sh inside ci.sh.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The pinned toolchain (rust-toolchain.toml); the action does not read that file itself.
          rust-version: "1.98.0"
          # `--locked` as in ci.sh: a Cargo.lock the manifest has outgrown is a failure, not a
          # silent re-resolution that checks a graph nobody builds.
          arguments: --locked
          command: check
